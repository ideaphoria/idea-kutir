<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Windows 95 Style Paintbrush & Painter's Palette Icon (Matching Paintbrush reference) -->
  <!-- Outer Black Contour for Palette -->
  <path d="M 12 3 C 6 3 2 8 2 15 C 2 22 7 28 14 28 C 18 28 22 26 24 23 C 25 21 24 19 22 18 C 20 17 20 15 22 13 C 24 11 26 12 27 10 C 28 8 27 5 24 4 C 20 3 16 3 12 3 Z" fill="#000000" />
  
  <!-- Palette Wooden Board Body -->
  <path d="M 12 4 C 7 4 3 9 3 15 C 3 21 8 27 14 27 C 17 27 21 25 23 22 C 24 20 23 18 21 17 C 19 16 19 14 21 12 C 23 10 25 11 26 9 C 27 7 26 5 23 5 C 19 4 16 4 12 4 Z" fill="#ffff99" />
  <!-- Shading on bottom edge of palette -->
  <path d="M 8 24 C 11 26 14 27 17 26 C 20 25 22 23 23 21 C 22 20 21 20 20 20 C 15 20 10 21 8 24 Z" fill="#d4c060" />

  <!-- Thumb Hole (Lower Right) -->
  <ellipse cx="19" cy="22" rx="2.5" ry="2" fill="#000000" />
  <ellipse cx="19" cy="22" rx="1.5" ry="1" fill="#ffffff" />

  <!-- Paint Blobs (Classic 16-color pure VGA pigments) -->
  <!-- 1. Red Blob (Top Left) -->
  <circle cx="8" cy="8" r="2.5" fill="#000000" />
  <circle cx="8" cy="8" r="2" fill="#ff0000" />
  <rect x="7" y="7" width="1" height="1" fill="#ffffff" />

  <!-- 2. Yellow / Gold Blob (Mid Left) -->
  <circle cx="6" cy="14" r="2.5" fill="#000000" />
  <circle cx="6" cy="14" r="2" fill="#ffff00" />
  <rect x="5" y="13" width="1" height="1" fill="#ffffff" />

  <!-- 3. Green Blob (Bottom Left) -->
  <circle cx="9" cy="20" r="2.5" fill="#000000" />
  <circle cx="9" cy="20" r="2" fill="#00aa00" />
  <rect x="8" y="19" width="1" height="1" fill="#aaffaa" />

  <!-- 4. Blue Blob (Bottom Center) -->
  <circle cx="15" cy="23" r="2.5" fill="#000000" />
  <circle cx="15" cy="23" r="2" fill="#0000ff" />
  <rect x="14" y="22" width="1" height="1" fill="#88bbff" />

  <!-- Paintbrush Angled Across Palette (From bottom-left to top-right) -->
  <!-- Brush Handle Outline & Fill -->
  <polygon points="14,15 28,4 30,6 16,17" fill="#000000" />
  <polygon points="15,15 28,5 29,6 16,16" fill="#804000" />
  <!-- Ferrule (Silver metal band) -->
  <polygon points="13,16 16,14 17,15 14,17" fill="#c0c0c0" />
  <!-- Brush Bristle / Hair Tip (Dipped in paint) -->
  <polygon points="10,19 13,16 14,17 11,20" fill="#000000" />
  <polygon points="11,19 13,17 14,18 12,20" fill="#ffffff" />
  <polygon points="10,21 11,19 12,20 11,22" fill="#000080" />
</svg>
