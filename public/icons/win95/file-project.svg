<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Windows 95 Executable / Project Window Icon -->
  <rect x="4" y="4" width="24" height="24" fill="#000000" />
  <rect x="5" y="5" width="22" height="22" fill="#c0c0c0" />
  <!-- Bevel highlights -->
  <line x1="5" y1="5" x2="26" y2="5" stroke="#ffffff" stroke-width="1" />
  <line x1="5" y1="5" x2="5" y2="26" stroke="#ffffff" stroke-width="1" />
  <line x1="26" y1="6" x2="26" y2="26" stroke="#808080" stroke-width="1" />
  <line x1="6" y1="26" x2="26" y2="26" stroke="#808080" stroke-width="1" />

  <!-- Window Navy Title Bar -->
  <rect x="7" y="7" width="18" height="4" fill="#000080" />
  <rect x="8" y="8" width="5" height="2" fill="#ffffff" />
  <rect x="22" y="8" width="2" height="2" fill="#c0c0c0" />

  <!-- Inset App Work Area -->
  <rect x="7" y="12" width="18" height="13" fill="#ffffff" />
  <!-- Application Graphic / Project Grid (Palette / Blueprint / Diamond) -->
  <rect x="9" y="14" width="6" height="5" fill="#008080" />
  <rect x="17" y="14" width="6" height="5" fill="#800080" />
  <rect x="9" y="21" width="14" height="2" fill="#ffcc00" />
</svg>
