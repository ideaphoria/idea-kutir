<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Windows 95 Closed Manila Folder Icon -->
  <!-- Outer Outline -->
  <path d="M 3 7 L 13 7 L 15 9 L 28 9 L 28 26 L 3 26 Z" fill="#000000" />
  <!-- Folder Back Flap -->
  <path d="M 4 8 L 12 8 L 14 10 L 27 10 L 27 25 L 4 25 Z" fill="#b89428" />
  <!-- Folder Front Body -->
  <rect x="4" y="11" width="23" height="14" fill="#ffd700" />
  <!-- Highlight on top and left edge -->
  <line x1="4" y1="11" x2="26" y2="11" stroke="#ffffe0" stroke-width="1" />
  <line x1="4" y1="11" x2="4" y2="24" stroke="#ffffe0" stroke-width="1" />
  <!-- Shading on bottom and right edge -->
  <line x1="4" y1="24" x2="26" y2="24" stroke="#cca625" stroke-width="1" />
  <line x1="26" y1="11" x2="26" y2="24" stroke="#cca625" stroke-width="1" />
  <!-- Subtle inner horizontal line -->
  <line x1="6" y1="14" x2="24" y2="14" stroke="#e6c030" stroke-width="1" />
</svg>
